<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>導領管理｜四個情境</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;background:#fff;height:100dvh;display:flex;flex-direction:column}.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;border-bottom:1px solid #ddd;flex:none;padding-top:env(safe-area-inset-top)}.tabs button{min-height:48px;padding:4px 2px;border:0;border-bottom:3px solid transparent;background:white;color:#888;font:inherit;font-size:12px;line-height:1.35;cursor:pointer}.tabs button span{display:block;font-weight:600;font-size:13px}.tabs button[aria-selected=true]{color:#ed3852;border-bottom-color:#ed3852;background:#fff6f8}iframe{width:100%;flex:1;border:0;min-height:0}iframe[hidden]{display:none}</style></head><body><nav class="tabs" role="tablist" aria-label="功能情境"><button role="tab" id="tab-pre-room" aria-controls="pre-room" aria-selected="true" data-page="pre-room">交班前<span>分房表</span></button><button role="tab" id="tab-trip-room" aria-controls="trip-room" aria-selected="false" data-page="trip-room" tabindex="-1">行程中<span>分房表</span></button><button role="tab" id="tab-pre-group" aria-controls="pre-group" aria-selected="false" data-page="pre-group" tabindex="-1">交班前<span>團體管理</span></button><button role="tab" id="tab-trip-group" aria-controls="trip-group" aria-selected="false" data-page="trip-group" tabindex="-1">行程中<span>團體管理</span></button></nav><script>const ids=['pre-room','trip-room','pre-group','trip-group'];function choose(id){document.querySelectorAll('[data-page]').forEach(b=>{b.setAttribute('aria-selected',b.dataset.page===id);b.tabIndex=b.dataset.page===id?0:-1});ids.forEach(key=>{let frame=document.getElementById(key);if(!frame&&key===id){frame=document.createElement('iframe');frame.id=key;frame.src='./'+key+'/index.html';frame.title=document.getElementById('tab-'+key).innerText.replace('\n','－');frame.setAttribute('role','tabpanel');frame.setAttribute('aria-labelledby','tab-'+key);document.body.append(frame)}if(frame)frame.hidden=key!==id});history.replaceState(null,'','#'+id)}document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('[data-page]');if(b)choose(b.dataset.page)};document.querySelector('.tabs').onkeydown=e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const i=ids.indexOf(document.activeElement.dataset.page),id=ids[(i+(e.key==='ArrowRight'?1:3))%4];choose(id);document.getElementById('tab-'+id).focus()};choose(ids.includes(location.hash.slice(1))?location.hash.slice(1):ids[0]);</script></body></html>
